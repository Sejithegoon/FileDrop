plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ca.wifidrop.net'
version = '0.1.0'

android {
  namespace "ca.wifidrop.net"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // React Native already ships OkHttp; Gradle picks one version for the whole app.
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
