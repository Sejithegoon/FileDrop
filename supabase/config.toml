# FileDrop Supabase project (forms backend). Deploy: see supabase/README.md
project_id = "filedrop"

[functions.forms]
# Public website forms: the function does its own abuse checks, so no Supabase login is required to call it.
verify_jwt = false

[functions.licence]
# Called by the FileDrop app (no Supabase login); the inbox's "issue" route checks the admin's token itself.
verify_jwt = false

[functions.payments]
# Called by Paddle; every request is checked against PADDLE_WEBHOOK_SECRET.
verify_jwt = false
